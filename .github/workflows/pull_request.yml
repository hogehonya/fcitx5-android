name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

jobs:
  build_pull_request:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext cmake ninja-build g++ python-is-python3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Bazelisk
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.28.1/bazelisk-linux-amd64 \
            --output "$RUNNER_TEMP/bazelisk"
          echo "22e7d3a188699982f661cf4687137ee52d1f24fec1ec893d91a6c4d791a75de8  $RUNNER_TEMP/bazelisk" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/bazelisk" "$HOME/.local/bin/bazelisk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare Mozc host tools and dictionary
        shell: bash
        run: bash plugin/mozc/tools/prepare-host.sh

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :assembleReleasePlugins

      - name: Upload app
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-ubuntu-24.04
          path: app/build/outputs/apk/release/

      # upload-artifact v4+ rejects non-GitHub servers as unsupported GHES.
      - name: Upload app (Gitea)
        if: ${{ github.server_url != 'https://github.com' }}
        uses: actions/upload-artifact@v3
        with:
          name: app-ubuntu-24.04
          path: app/build/outputs/apk/release/
          if-no-files-found: error

      - name: Pack plugins
        shell: bash
        run: |
          mkdir plugins-to-upload
          for i in $(ls plugin)
          do
            if [ -d "plugin/${i}" ]
            then
              mv "plugin/${i}/build/outputs/apk/release" "plugins-to-upload/${i}"
            fi
          done

      - name: Upload plugins
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@v7
        with:
          name: plugins-ubuntu-24.04
          path: plugins-to-upload

      - name: Upload plugins (Gitea)
        if: ${{ github.server_url != 'https://github.com' }}
        uses: actions/upload-artifact@v3
        with:
          name: plugins-ubuntu-24.04
          path: plugins-to-upload
          if-no-files-found: error
